<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debt Settlement Callback Script</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 18px; }
        :root {
            --bg: #0c0c14; --surface: #14141f; --surface2: #1a1a28;
            --border: rgba(255,255,255,0.07); --border-hover: rgba(255,255,255,0.14);
            --text: #e2e4ea; --text-dim: rgba(255,255,255,0.35); --text-mid: rgba(255,255,255,0.6);
            --accent: #8b5cf6; --accent2: #06b6d4;
            --yes: #10b981; --no: #f43f5e; --less: #3b82f6; --over: #a855f7;
        }
        [data-theme="light"] {
            --bg: #f3f3f7; --surface: #fff; --surface2: #f9f9fb;
            --border: rgba(0,0,0,0.08); --border-hover: rgba(0,0,0,0.15);
            --text: #1a1a2e; --text-dim: rgba(0,0,0,0.35); --text-mid: rgba(0,0,0,0.6);
            --accent: #7c3aed; --accent2: #0891b2;
        }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased; }

        /* Layout */
        .split-wrap { display: flex; width: 100%; min-height: 100vh; }
        .app { flex: 1 1 100%; display: flex; flex-direction: column; min-height: 100vh; min-width: 0; transition: flex 0.3s ease; }

        /* Topbar */
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
        .topbar-left { display: flex; align-items: center; gap: 10px; }
        .topbar-logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
        .topbar-logo svg { width: 15px; height: 15px; color: #fff; }
        .topbar-brand { font-size: 0.78rem; font-weight: 800; color: var(--text); }
        .topbar-sub { font-size: 0.55rem; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
        .topbar-right { display: flex; align-items: center; gap: 6px; }
        .icon-btn { width: 30px; height: 30px; border-radius: 7px; background: var(--surface2); border: 1px solid var(--border); color: var(--text-mid); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; }
        .icon-btn:hover { border-color: var(--border-hover); color: var(--text); }
        .icon-btn svg { width: 13px; height: 13px; }
        .timer-chip { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 7px; background: var(--surface2); border: 1px solid var(--border); font-family: 'SF Mono','Consolas', monospace; font-size: 0.72rem; font-weight: 700; color: var(--accent); }
        .timer-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
        .sm-btn { padding: 4px 10px; height: 30px; border-radius: 7px; background: var(--surface2); border: 1px solid var(--border); color: var(--text-mid); font-size: 0.6rem; font-weight: 700; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 4px; font-family: inherit; }
        .sm-btn:hover { border-color: var(--border-hover); color: var(--text); }
        .sm-btn svg { width: 11px; height: 11px; }
        .sm-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* State dropdown */
        .state-wrap { position: relative; }
        .state-dropdown { position: absolute; top: calc(100% + 4px); right: 0; width: 260px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); z-index: 100; opacity: 0; visibility: hidden; transform: translateY(-4px); transition: all 0.15s ease; overflow: hidden; }
        .state-dropdown.open { opacity: 1; visibility: visible; transform: none; }
        .state-search-wrap { padding: 8px 10px 6px; border-bottom: 1px solid var(--border); position: relative; }
        .state-search-icon { position: absolute; left: 19px; top: 17px; width: 12px; height: 12px; color: var(--text-dim); pointer-events: none; }
        .state-search { width: 100%; padding: 6px 8px 6px 28px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 0.68rem; font-family: inherit; outline: none; }
        .state-search:focus { border-color: var(--accent); }
        .state-list { max-height: 240px; overflow-y: auto; padding: 4px; }
        .state-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; }
        .state-item:hover { background: var(--surface2); }
        .state-item-abbr { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.55rem; font-weight: 800; flex-shrink: 0; }
        .state-item-abbr.ok { background: rgba(16,185,129,0.1); color: var(--yes); border: 1px solid rgba(16,185,129,0.2); }
        .state-item-abbr.no { background: rgba(244,63,94,0.08); color: var(--no); border: 1px solid rgba(244,63,94,0.15); text-decoration: line-through; }
        .state-item-name { flex: 1; font-size: 0.68rem; font-weight: 500; color: var(--text); }
        .state-item-name.excluded { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--no); }
        .state-item-badge { font-size: 0.5rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
        .state-item-badge.ok { background: rgba(16,185,129,0.1); color: var(--yes); }
        .state-item-badge.no { background: rgba(244,63,94,0.08); color: var(--no); }
        .state-empty { text-align: center; padding: 20px; color: var(--text-dim); font-size: 0.68rem; }
        .state-footer { padding: 6px 10px; border-top: 1px solid var(--border); font-size: 0.5rem; color: var(--text-dim); text-align: center; font-weight: 600; }

        /* Form panel */
        .form-panel { flex: 0 0 0%; width: 0; overflow: hidden; border-left: 1px solid var(--border); background: var(--surface); transition: flex 0.3s ease; display: flex; flex-direction: column; }
        .form-panel.open { flex: 0 0 50%; width: 50%; }
        .form-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .form-panel-title { font-size: 0.72rem; font-weight: 700; color: var(--text-mid); display: flex; align-items: center; gap: 6px; }
        .form-panel-title svg { width: 13px; height: 13px; }
        .form-panel-close { width: 28px; height: 28px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border); color: var(--text-mid); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
        .form-panel-close:hover { color: var(--text); }
        .form-panel-close svg { width: 12px; height: 12px; }
        .form-panel iframe { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }

        /* Progress */
        .progress-section { padding: 14px 16px 0; }
        .progress-track { max-width: 240px; margin: 0 auto; display: flex; align-items: center; }
        .prog-node { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.52rem; font-weight: 800; color: var(--text-dim); flex-shrink: 0; background: transparent; transition: all 0.3s; }
        .prog-node.active { border-color: var(--accent); color: #fff; background: var(--accent); }
        .prog-node.done { border-color: var(--accent); color: #fff; background: var(--accent); opacity: 0.35; }
        .prog-node.ended { border-color: var(--no); color: #fff; background: var(--no); }
        .prog-line { flex: 1; height: 2px; background: var(--border); border-radius: 1px; position: relative; min-width: 6px; }
        .prog-line::after { content: ''; position: absolute; inset: 0; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 0.4s ease; }
        .prog-line.filled::after { transform: scaleX(1); }
        .step-label { text-align: center; padding: 6px 16px 0; font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }

        /* Main */
        .main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 16px; }

        /* Card */
        .script-card { max-width: 520px; width: 100%; animation: cardIn 0.25s ease-out; }
        @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }

        /* Badge */
        .step-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 16px; font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; background: rgba(139,92,246,0.08); color: var(--accent); border: 1px solid rgba(139,92,246,0.15); }
        .step-badge .num { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.5rem; font-weight: 900; color: #fff; background: var(--accent); }
        .step-badge.s-end { background: rgba(244,63,94,0.08); color: var(--no); border-color: rgba(244,63,94,0.15); }
        .step-badge.s-end .num { background: var(--no); }

        /* Agent label + text */
        .agent-label { display: inline-flex; align-items: center; gap: 5px; font-size: 0.58rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 10px; padding: 2px 8px; border-radius: 5px; background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.12); }
        .agent-label::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
        .script-text { font-size: 0.9rem; font-weight: 500; line-height: 1.75; color: var(--text); padding: 14px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--accent); }
        .script-text strong { font-weight: 700; }
        [data-theme="light"] .script-text strong { color: #111; }

        /* Buttons */
        .actions { display: flex; gap: 8px; margin-top: 14px; }
        .btn { flex: 1; padding: 12px 14px; border-radius: 10px; font-family: inherit; border: 1px solid transparent; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; }
        .btn:active { transform: scale(0.97); }
        .btn-row { display: flex; align-items: center; gap: 6px; }
        .btn-row svg { width: 14px; height: 14px; flex-shrink: 0; }
        .btn-label { font-size: 0.78rem; font-weight: 700; }
        .btn-sub { font-size: 0.55rem; font-weight: 500; opacity: 0.5; }
        .btn-yes { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.2); color: var(--yes); }
        .btn-yes:hover { background: #10b981; color: #fff; border-color: #10b981; }
        .btn-no { background: rgba(244,63,94,0.06); border-color: rgba(244,63,94,0.15); color: var(--no); }
        .btn-no:hover { background: #f43f5e; color: #fff; border-color: #f43f5e; }
        .btn-less { background: rgba(59,130,246,0.08); border-color: rgba(59,130,246,0.2); color: var(--less); }
        .btn-less:hover { background: #3b82f6; color: #fff; border-color: #3b82f6; }
        .btn-over { background: rgba(168,85,247,0.08); border-color: rgba(168,85,247,0.2); color: var(--over); }
        .btn-over:hover { background: #a855f7; color: #fff; border-color: #a855f7; }
        .btn-go { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.2); color: var(--yes); }
        .btn-go:hover { background: #10b981; color: #fff; border-color: #10b981; }
        .btn-ghost { background: var(--surface2); border-color: var(--border); color: var(--text-mid); }
        .btn-ghost:hover { border-color: var(--border-hover); color: var(--text); }
        .btn-back { background: var(--surface2); border-color: var(--border); color: var(--text-mid); flex: 0 0 auto; min-width: 42px; min-height: auto; padding: 12px; }
        .btn-back:hover { border-color: var(--border-hover); color: var(--text); }
        .btn-back svg { width: 14px; height: 14px; }

        /* Debt chip */
        .debt-chip { margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .debt-chip-icon { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .debt-chip-icon svg { width: 14px; height: 14px; color: #fff; }
        .debt-chip-label { font-size: 0.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); }
        .debt-chip-value { font-size: 0.8rem; font-weight: 800; margin-top: 1px; }

        /* Keyboard hints */
        .kb-hint { text-align: center; margin-top: 10px; font-size: 0.52rem; color: var(--text-dim); display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .kbd { display: inline-block; padding: 1px 5px; border-radius: 4px; background: var(--surface2); border: 1px solid var(--border); font-family: 'SF Mono','Consolas', monospace; font-size: 0.5rem; font-weight: 600; color: var(--text-mid); }

        /* Transfer anim */
        .xfer-anim { text-align: center; padding: 28px 0; }
        .spinner-ring { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent); border-right-color: var(--accent2); animation: spin 0.7s linear infinite; margin: 0 auto 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .xfer-anim h3 { font-size: 0.88rem; font-weight: 700; margin-bottom: 4px; }
        .xfer-anim p { color: var(--text-dim); font-size: 0.72rem; }
        .done-badge { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; animation: pop 0.3s ease-out; }
        @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .done-badge svg { width: 16px; height: 16px; color: #fff; }

        /* Footer */
        .footer { padding: 10px 14px; text-align: center; font-size: 0.5rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; }

        /* Responsive */
        @media (max-width: 480px) {
            html { font-size: 16px; }
            .actions { flex-direction: column; }
            .kb-hint { display: none; }
            .topbar-sub { display: none; }
            .sm-btn span:last-child { display: none; }
            .form-panel.open { flex: 0 0 100%; width: 100%; position: fixed; inset: 0; z-index: 100; }
        }
    </style>
</head>
<body>
    <div class="split-wrap">
        <div class="app">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="topbar-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    </div>
                    <div>
                        <div class="topbar-brand">Debt Interactive Scripting</div>
                        <div class="topbar-sub">Facebook Lead Callback</div>
                    </div>
                </div>
                <div class="topbar-right">
                    <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">
                        <svg id="sunIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                        <svg id="moonIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </button>
                    <div class="timer-chip"><div class="timer-dot"></div><span id="timer">00:00</span></div>
                    <div class="state-wrap" id="stateWrap">
                        <button class="sm-btn" id="stateToggle" onclick="toggleStateDropdown()" title="Check accepted states">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            <span>States</span>
                        </button>
                        <div class="state-dropdown" id="stateDropdown">
                            <div class="state-search-wrap">
                                <svg class="state-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                                <input type="text" class="state-search" id="stateSearch" placeholder="Search state..." oninput="filterStates(this.value)">
                            </div>
                            <div class="state-list" id="stateList"></div>
                            <div class="state-footer">47 accepted &middot; 3 excluded (RI, OR, WV)</div>
                        </div>
                    </div>
                    <button class="sm-btn" id="formToggle" onclick="toggleFormPanel()" title="Toggle Lead Form">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                        <span>Lead Form</span>
                    </button>
                    <button class="sm-btn" onclick="resetCall()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                        <span>Reset</span>
                    </button>
                </div>
            </header>
            <div class="progress-section">
                <div class="progress-track">
                    <div class="prog-node active" id="d1">1</div>
                    <div class="prog-line" id="l1"></div>
                    <div class="prog-node" id="d2">2</div>
                    <div class="prog-line" id="l2"></div>
                    <div class="prog-node" id="d3">3</div>
                </div>
            </div>
            <div class="step-label" id="stepLabel">Step 1 of 3 &mdash; Opening</div>
            <main class="main" id="main"></main>
            <footer class="footer">Debt Settlement Callback Script</footer>
        </div>
        <div class="form-panel" id="formPanel">
            <div class="form-panel-header">
                <div class="form-panel-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                    Lead Form
                </div>
                <button class="form-panel-close" onclick="toggleFormPanel()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <iframe id="formIframe" data-src="https://docs.google.com/forms/d/e/1FAIpQLSfzLvJijU40uAcZdR1kNh962LRpLbA4XlWHqbNwBXu4CVvWNQ/viewform?usp=publish-editor" src="about:blank"></iframe>
        </div>
    </div>

<script>
// ── State Search ──
const EXCLUDED = new Set(['RI','OR','WV']);
const STATES = [
    ['AL','Alabama'],['AK','Alaska'],['AZ','Arizona'],['AR','Arkansas'],['CA','California'],['CO','Colorado'],['CT','Connecticut'],['DE','Delaware'],['FL','Florida'],['GA','Georgia'],['HI','Hawaii'],['ID','Idaho'],['IL','Illinois'],['IN','Indiana'],['IA','Iowa'],['KS','Kansas'],['KY','Kentucky'],['LA','Louisiana'],['ME','Maine'],['MD','Maryland'],['MA','Massachusetts'],['MI','Michigan'],['MN','Minnesota'],['MS','Mississippi'],['MO','Missouri'],['MT','Montana'],['NE','Nebraska'],['NV','Nevada'],['NH','New Hampshire'],['NJ','New Jersey'],['NM','New Mexico'],['NY','New York'],['NC','North Carolina'],['ND','North Dakota'],['OH','Ohio'],['OK','Oklahoma'],['OR','Oregon'],['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],['SD','South Dakota'],['TN','Tennessee'],['TX','Texas'],['UT','Utah'],['VT','Vermont'],['VA','Virginia'],['WA','Washington'],['WV','West Virginia'],['WI','Wisconsin'],['WY','Wyoming'],['DC','District of Columbia']
];
let stateOpen = false;
function toggleStateDropdown(){
    stateOpen = !stateOpen;
    document.getElementById('stateDropdown').classList.toggle('open', stateOpen);
    document.getElementById('stateToggle').classList.toggle('active', stateOpen);
    if(stateOpen){ const input = document.getElementById('stateSearch'); input.value = ''; renderStates(STATES); setTimeout(() => input.focus(), 80); }
}
function renderStates(list){
    const el = document.getElementById('stateList');
    if(!list.length){ el.innerHTML = '<div class="state-empty">No states found</div>'; return; }
    el.innerHTML = list.map(([abbr, name]) => {
        const ex = EXCLUDED.has(abbr);
        return `<div class="state-item"><div class="state-item-abbr ${ex?'no':'ok'}">${abbr}</div><div class="state-item-name ${ex?'excluded':''}">${name}</div><div class="state-item-badge ${ex?'no':'ok'}">${ex?'No':'Yes'}</div></div>`;
    }).join('');
}
function filterStates(q){
    q = q.trim().toLowerCase();
    if(!q){ renderStates(STATES); return; }
    renderStates(STATES.filter(([a,n]) => a.toLowerCase().includes(q) || n.toLowerCase().includes(q)));
}
document.addEventListener('click', e => {
    if(stateOpen && !document.getElementById('stateWrap').contains(e.target)){
        stateOpen = false;
        document.getElementById('stateDropdown').classList.remove('open');
        document.getElementById('stateToggle').classList.remove('active');
    }
});

// ── Form Panel ──
let formOpen = false;
function toggleFormPanel(){
    formOpen = !formOpen;
    const panel = document.getElementById('formPanel');
    const btn = document.getElementById('formToggle');
    const iframe = document.getElementById('formIframe');
    if(formOpen){ panel.classList.add('open'); btn.classList.add('active'); if(iframe.src === 'about:blank' || !iframe.src) iframe.src = iframe.dataset.src; }
    else { panel.classList.remove('open'); btn.classList.remove('active'); }
}

// ── Theme ──
(function(){ const s = localStorage.getItem('script-theme'); if(s==='light') document.documentElement.setAttribute('data-theme','light'); })();
function toggleTheme(){
    const l = document.documentElement.getAttribute('data-theme')==='light';
    document.documentElement.setAttribute('data-theme', l?'dark':'light');
    localStorage.setItem('script-theme', l?'dark':'light');
    const sun = document.getElementById('sunIcon'), moon = document.getElementById('moonIcon');
    if(sun&&moon){ sun.style.display=l?'':'none'; moon.style.display=l?'none':''; }
}

// ── App State ──
let step = 0, startTime = null, timerRef = null, debtCat = '', hist = [];
const STEPS = ['Opening','Confirm Availability','Transfer'];
startTime = Date.now(); timerRef = setInterval(tick, 1000);

function resetCall(){ clearInterval(timerRef); step=0; startTime=Date.now(); debtCat=''; hist=[]; timerRef=setInterval(tick,1000); go(1); }
function tick(){ const s=Math.floor((Date.now()-startTime)/1000); document.getElementById('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

function setProgress(n, ended){
    for(let i=1;i<=3;i++){
        const d=document.getElementById('d'+i), l=document.getElementById('l'+(i-1));
        if(ended) d.className='prog-node'+(i===1?' ended':'');
        else d.className='prog-node'+(i<n?' done':i===n?' active':'');
        if(l) l.className='prog-line'+(ended?'':i<n?' filled':'');
    }
    document.getElementById('stepLabel').innerHTML = ended?'Call Ended':`Step ${n} of 3 &mdash; ${STEPS[n-1]}`;
}
function mp(s){ return s<=1?1:s<=4||s===98?2:3; }

function go(n){
    if(step>0&&step!==99) hist.push(step);
    step=n; setProgress(mp(n),false);
    const m=document.getElementById('main');
    const r={1:rOpen,2:rAvail,3:rDebt,4:rSpec,5:rXfer,98:rCallback,99:rEnd};
    (r[n]||rEnd)(m);
}
function goBack(){
    if(!hist.length) return;
    const p=hist.pop(); step=p; setProgress(mp(p),false);
    const m=document.getElementById('main');
    const r={1:rOpen,2:rAvail,3:rDebt,4:rSpec,5:rXfer,98:rCallback};
    (r[p]||rOpen)(m);
}

// ── Helpers ──
const gc = h => `<div class="card">${h}</div>`;
const bd = (c,n,t) => `<div class="step-badge ${c}"><span class="num">${n}</span>${t}</div>`;
const tx = t => `<div class="agent-label">Agent</div><div class="script-text">${t}</div>`;
const kb = (items,back) => `<div class="kb-hint">${items.map(i=>`<span class="kbd">${i.k}</span> ${i.l}`).join('&nbsp;&nbsp;')}${back?'&nbsp;&nbsp;<span class="kbd">←</span> Back':''}</div>`;
const bb = () => `<button class="btn btn-back" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>`;
const chk = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
const xIc = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;

// ── Step 1: Opening ──
function rOpen(el){
    el.innerHTML=`<div class="script-card">${gc(`
        ${bd('','1','Opening')}
        ${tx('Hello, this is (Agent Name). I see you filled out a form on <strong>Facebook</strong> looking for credit relief. <strong>Are you still looking for help with that?</strong>')}
        <div class="actions">
            <button class="btn btn-yes" onclick="go(2)"><span class="btn-row">${chk}<span class="btn-label">Yes</span></span><span class="btn-sub">Continue to availability</span></button>
            <button class="btn btn-no" onclick="go(99)"><span class="btn-row">${xIc}<span class="btn-label">No</span></span><span class="btn-sub">Thank them &amp; end call</span></button>
        </div>
        ${kb([{k:'Y',l:'Yes'},{k:'N',l:'No'}])}
    `)}</div>`;
}

// ── Step 2: Availability ──
function rAvail(el){
    el.innerHTML=`<div class="script-card">${gc(`
        ${bd('','2','Availability')}
        ${tx('Great. <strong>Do you have a few minutes to talk with one of our agents now?</strong>')}
        <div class="actions">
            ${bb()}
            <button class="btn btn-yes" onclick="go(3)"><span class="btn-row">${chk}<span class="btn-label">Yes</span></span><span class="btn-sub">Continue to debt check</span></button>
            <button class="btn btn-no" onclick="go(98)"><span class="btn-row">${xIc}<span class="btn-label">No</span></span><span class="btn-sub">Ask for callback time</span></button>
        </div>
        ${kb([{k:'Y',l:'Yes'},{k:'N',l:'No'}],true)}
    `)}</div>`;
}

// ── Step 3: Debt Check ──
function rDebt(el){
    el.innerHTML=`<div class="script-card">${gc(`
        ${bd('','2','Availability')}
        ${tx('<strong>Can you please confirm if your total debt amount is less than $15K or over $15K?</strong>')}
        <div class="actions">
            ${bb()}
            <button class="btn btn-less" onclick="debtCat='less';go(4)"><span class="btn-row">${chk}<span class="btn-label">Under $15K</span></span><span class="btn-sub">Less than 15 thousand</span></button>
            <button class="btn btn-over" onclick="debtCat='over';go(4)"><span class="btn-row">${chk}<span class="btn-label">Over $15K</span></span><span class="btn-sub">15 thousand or more</span></button>
        </div>
        ${kb([{k:'<',l:'Under'},{k:'>',l:'Over'}],true)}
    `)}</div>`;
}

// ── Step 4: Specialist ──
function rSpec(el){
    el.innerHTML=`<div class="script-card">${gc(`
        ${bd('','2','Availability')}
        ${tx('Perfect! <strong>Do you have a few minutes to talk to one of our debt specialists now to help with your debt?</strong>')}
        <div class="actions">
            ${bb()}
            <button class="btn btn-yes" onclick="go(5)"><span class="btn-row">${chk}<span class="btn-label">Yes</span></span><span class="btn-sub">Proceed to transfer</span></button>
            <button class="btn btn-no" onclick="go(99)"><span class="btn-row">${xIc}<span class="btn-label">No</span></span><span class="btn-sub">Thank them &amp; end call</span></button>
        </div>
        ${kb([{k:'Y',l:'Yes'},{k:'N',l:'No'}],true)}
    `)}</div>`;
}

// ── Step 98: Callback ──
function rCallback(el){
    el.innerHTML=`<div class="script-card">${gc(`
        ${bd('','2','Callback')}
        ${tx('Ask for a better time to call back. <strong>Do you have a specific time or day for call back?</strong>')}
        <div class="actions">
            ${bb()}
            <button class="btn btn-ghost" onclick="go(99)" style="flex:2;"><span class="btn-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="btn-label">Alright, End Call</span></span><span class="btn-sub">Thank you for your time. Have a great day!</span></button>
        </div>
        ${kb([{k:'Enter',l:'or'},{k:'N',l:'End Call'}],true)}
    `)}</div>`;
}

// ── Step 5: Transfer ──
function rXfer(el){
    const lbl=debtCat==='less'?'Under $15K':'Over $15K';
    const bg=debtCat==='less'?'background:#3b82f6':'background:#a855f7';
    const tc=debtCat==='less'?'color:#3b82f6':'color:#a855f7';
    el.innerHTML=`<div class="script-card">${gc(`
        ${bd('','3','Transfer')}
        ${tx("Great, I'll transfer you now. <strong>One moment.</strong>")}
        <div class="debt-chip">
            <div class="debt-chip-icon" style="${bg}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
            <div><div class="debt-chip-label">Debt Category</div><div class="debt-chip-value" style="${tc}">${lbl}</div></div>
        </div>
        <div class="actions">
            ${bb()}
            <button class="btn btn-go" onclick="doTransfer()" style="flex:2;"><span class="btn-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg><span class="btn-label">Initiate Transfer</span></span><span class="btn-sub">Cold transfer to next available agent</span></button>
        </div>
        ${kb([{k:'Enter',l:'or'},{k:'T',l:'Transfer'}],true)}
    `)}</div>`;
}

function doTransfer(){
    const el=document.getElementById('main');
    el.querySelector('.card').innerHTML=`<div class="xfer-anim"><div class="spinner-ring"></div><h3>Transferring Call&hellip;</h3><p>Connecting to next available agent</p></div>`;
    setTimeout(()=>{
        el.querySelector('.card').innerHTML=`<div class="xfer-anim"><div class="done-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><h3>Transfer Complete</h3><p>Lead has been transferred successfully.</p><div class="actions" style="justify-content:center;margin-top:16px;"><button class="btn btn-ghost" onclick="resetCall()"><span class="btn-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg><span class="btn-label">New Call</span></span></button></div></div>`;
    },2200);
}

function rEnd(el){
    setProgress(0,true); clearInterval(timerRef);
    el.innerHTML=`<div class="script-card">${gc(`
        ${bd('s-end','×','Ended')}
        ${tx('<strong>Thank you for your time. Have a great day!</strong>')}
        <div class="actions" style="margin-top:14px;"><button class="btn btn-ghost" onclick="resetCall()"><span class="btn-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg><span class="btn-label">New Call</span></span></button></div>
    `)}</div>`;
}

// ── Init ──
(function(){
    const sun=document.getElementById('sunIcon'), moon=document.getElementById('moonIcon');
    if(sun&&moon){ const l=document.documentElement.getAttribute('data-theme')==='light'; sun.style.display=l?'':'none'; moon.style.display=l?'none':''; }
})();
go(1);

// ── Keyboard ──
document.addEventListener('keydown', e => {
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    const k=e.key.toLowerCase();
    if(k==='escape'){resetCall();return;}
    if(k==='backspace'||k==='arrowleft'){goBack();return;}
    if(step===1){if(k==='y')go(2);else if(k==='n')go(99);}
    else if(step===2){if(k==='y')go(3);else if(k==='n')go(98);}
    else if(step===98){if(k==='enter'||k==='n')go(99);}
    else if(step===3){if(k==='<'||k===','){debtCat='less';go(4);}else if(k==='>'||k==='.'){debtCat='over';go(4);}}
    else if(step===4){if(k==='y')go(5);else if(k==='n')go(99);}
    else if(step===5){if(k==='enter'||k==='t')doTransfer();}
});
</script>
</body>
</html>
