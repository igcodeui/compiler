// ===================== APP STATE =====================
const App = {
  state: {
    currentView: 'home',
    currentScriptId: null,
    currentStepId: null,
    sidebarOpen: false,
    searchQuery: '',
    searchOpen: false,
    rightPanelOpen: false,
    activeRightTab: 'quickref',
    visitedSteps: new Set(),
    navHistory: [],
  },

  get bookmarks() {
    try { return JSON.parse(localStorage.getItem('hh-bookmarks') || '{}'); } catch { return {}; }
  },
  set bookmarks(v) {
    localStorage.setItem('hh-bookmarks', JSON.stringify(v));
  },
  get notes() {
    try { return JSON.parse(localStorage.getItem('hh-notes') || '{}'); } catch { return {}; }
  },
  set notes(v) {
    localStorage.setItem('hh-notes', JSON.stringify(v));
  },

  get currentScript() {
    return scripts.find(s => s.id === this.state.currentScriptId);
  },
  get currentStep() {
    const s = this.currentScript;
    return s ? s.steps.find(st => st.id === this.state.currentStepId) : null;
  },
  get currentStepIndex() {
    const s = this.currentScript;
    if (!s) return 0;
    return s.steps.findIndex(st => st.id === this.state.currentStepId);
  },
  get progress() {
    const s = this.currentScript;
    if (!s) return 0;
    const idx = this.currentStepIndex;
    return Math.round(((idx + 1) / s.steps.length) * 100);
  },

  init() {
    this.render();
  },

  selectScript(id) {
    const s = scripts.find(sc => sc.id === id);
    if (!s) return;
    this.state.currentScriptId = id;
    this.state.currentStepId = s.startStepId;
    this.state.currentView = 'script';
    this.state.sidebarOpen = false;
    this.state.searchQuery = '';
    this.state.searchOpen = false;
    this.state.rightPanelOpen = false;
    this.state.visitedSteps = new Set([s.startStepId]);
    this.render();
  },

  goToStep(stepId) {
    if (this.state.currentStepId && this.state.currentStepId !== stepId) {
      this.state.navHistory.push(this.state.currentStepId);
    }
    this.state.currentStepId = stepId;
    this.state.visitedSteps.add(stepId);
    if (window.innerWidth < 768) {
      this.state.sidebarOpen = false;
    }
    this.render();
  },

  goBack() {
    if (this.state.navHistory.length > 0) {
      const prev = this.state.navHistory.pop();
      this.state.currentStepId = prev;
      this.render();
    }
  },

  goHome() {
    this.state.currentView = 'home';
    this.state.currentScriptId = null;
    this.state.currentStepId = null;
    this.state.sidebarOpen = false;
    this.state.rightPanelOpen = false;
    this.render();
  },

  toggleSidebar() {
    this.state.sidebarOpen = !this.state.sidebarOpen;
    this.renderSidebar();
    this.renderOverlay();
  },

  toggleRightPanel(tab) {
    if (tab) {
      this.state.activeRightTab = tab;
    }
    this.state.rightPanelOpen = !this.state.rightPanelOpen;
    this.renderRightPanel();
    this.renderOverlay();
  },

  toggleBookmark(stepId) {
    const b = this.bookmarks;
    const key = this.state.currentScriptId;
    if (!b[key]) b[key] = [];
    const idx = b[key].indexOf(stepId);
    if (idx >= 0) b[key].splice(idx, 1);
    else b[key].push(stepId);
    this.bookmarks = b;
    this.render();
  },

  isBookmarked(stepId) {
    const b = this.bookmarks;
    const key = this.state.currentScriptId;
    return b[key] && b[key].includes(stepId);
  },

  saveNote(text) {
    const n = this.notes;
    const key = this.state.currentScriptId;
    n[key] = text;
    this.notes = n;
  },

  getNote() {
    const n = this.notes;
    const key = this.state.currentScriptId;
    return n[key] || '';
  },

  copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
      this.showToast('Copied to clipboard!');
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      this.showToast('Copied to clipboard!');
    });
  },

  showToast(msg) {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = 'copy-toast bg-gray-900 text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium';
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  },

  handleSearch(q) {
    this.state.searchQuery = q;
    this.renderSidebarSteps();
  },

  getFilteredSteps() {
    const s = this.currentScript;
    if (!s) return [];
    const q = this.state.searchQuery.toLowerCase().trim();
    if (!q) return s.steps;
    return s.steps.filter(st =>
      st.title.toLowerCase().includes(q) ||
      st.text.toLowerCase().includes(q) ||
      (st.notes && st.notes.toLowerCase().includes(q))
    );
  },

  // =========== COLOR HELPERS ===========
  getColorClasses() {
    const theme = this.currentScript?.colorTheme || 'emerald';
    const map = {
      emerald: { accent: 'emerald', border: 'border-emerald-300', bg: 'bg-emerald-50', text: 'text-emerald-700', dot: 'bg-emerald-500', progressBg: 'bg-emerald-100', progressFill: 'bg-emerald-500' },
      amber:   { accent: 'amber', border: 'border-amber-300', bg: 'bg-amber-50', text: 'text-amber-700', dot: 'bg-amber-500', progressBg: 'bg-amber-100', progressFill: 'bg-amber-500' },
      rose:    { accent: 'rose', border: 'border-rose-300', bg: 'bg-rose-50', text: 'text-rose-700', dot: 'bg-rose-500', progressBg: 'bg-rose-100', progressFill: 'bg-rose-500' },
      purple:  { accent: 'purple', border: 'border-purple-300', bg: 'bg-purple-50', text: 'text-purple-700', dot: 'bg-purple-500', progressBg: 'bg-purple-100', progressFill: 'bg-purple-500' },
    };
    return map[theme] || map.emerald;
  },

  getStepTypeStyle(type) {
    const map = {
      greeting:   { border: 'border-l-emerald-500', icon: '🎤', bg: '', badgeBg: 'bg-emerald-100 text-emerald-800', label: 'Greeting' },
      question:   { border: 'border-l-teal-500', icon: '❓', bg: '', badgeBg: 'bg-teal-100 text-teal-800', label: 'Question' },
      agent_says: { border: 'border-l-gray-400', icon: '💬', bg: '', badgeBg: 'bg-gray-100 text-gray-700', label: 'Agent Says' },
      member_response: { border: 'border-l-teal-400', icon: '🗣️', bg: '', badgeBg: 'bg-teal-100 text-teal-800', label: 'Member' },
      info:      { border: 'border-l-amber-500', icon: 'ℹ️', bg: 'bg-amber-50/50', badgeBg: 'bg-amber-100 text-amber-800', label: 'Info' },
      transfer:  { border: 'border-l-orange-500', icon: '🔀', bg: 'bg-orange-50/50', badgeBg: 'bg-orange-100 text-orange-800', label: 'Transfer' },
      dq:        { border: 'border-l-red-500', icon: '🚫', bg: 'bg-red-50', badgeBg: 'bg-red-100 text-red-800', label: 'DQ' },
      handshake: { border: 'border-l-violet-500', icon: '🤝', bg: 'bg-violet-50/50', badgeBg: 'bg-violet-100 text-violet-800', label: 'Handshake' },
      rebuttal:  { border: 'border-l-slate-400', icon: '🔄', bg: 'bg-slate-50', badgeBg: 'bg-slate-100 text-slate-700', label: 'Rebuttal' },
      note:      { border: 'border-l-gray-300', icon: '📝', bg: 'bg-gray-50', badgeBg: 'bg-gray-100 text-gray-600', label: 'System' },
    };
    return map[type] || map.agent_says;
  },

  getBadgeStyle(badge) {
    const b = badge.toUpperCase();
    if (b.includes('READ ALOUD') || b.includes('KEY SELLING')) return 'bg-emerald-100 text-emerald-800';
    if (b.includes('DQ')) return 'bg-red-100 text-red-800';
    if (b.includes('MUTE') || b.includes('UNMUTE')) return 'bg-orange-100 text-orange-800';
    if (b.includes('WARM TRANSFER')) return 'bg-purple-100 text-purple-800';
    if (b.includes('CROSS-SELL') || b.includes('CROSS SELL')) return 'bg-teal-100 text-teal-800';
    if (b.includes('SOFT EXIT')) return 'bg-gray-200 text-gray-700';
    if (b.includes('RECORDED')) return 'bg-sky-100 text-sky-800';
    if (b.includes('COMMON OBJECTION')) return 'bg-slate-200 text-slate-700';
    return 'bg-gray-100 text-gray-700';
  },

  getQuickRefStyle(type) {
    const map = {
      dq: 'border-l-red-400 bg-red-50/50',
      transfer: 'border-l-orange-400 bg-orange-50/50',
      handshake: 'border-l-violet-400 bg-violet-50/50',
      rebuttal: 'border-l-slate-400 bg-slate-50/50',
      exit: 'border-l-gray-400 bg-gray-50/50',
    };
    return map[type] || 'border-l-gray-300 bg-gray-50/50';
  },

  // =========== RENDER ===========
  render() {
    const app = document.getElementById('app');
    if (this.state.currentView === 'home') {
      app.innerHTML = this.renderHome();
    } else {
      app.innerHTML = this.renderScriptViewer();
    }
    this.attachEvents();
  },

  renderOverlay() {
    let ov = document.getElementById('mobile-overlay');
    const isOpen = this.state.sidebarOpen || this.state.rightPanelOpen;
    if (!ov && isOpen) {
      ov = document.createElement('div');
      ov.id = 'mobile-overlay';
      ov.className = 'overlay fixed inset-0 z-30 md:hidden';
      ov.onclick = () => {
        this.state.sidebarOpen = false;
        this.state.rightPanelOpen = false;
        this.renderSidebar();
        this.renderRightPanel();
        ov.remove();
      };
      document.body.appendChild(ov);
    } else if (ov && !isOpen) {
      ov.remove();
    }
  },

  // =========== HOME VIEW ===========
  renderHome() {
    return `
    <header class="border-b border-gray-100 bg-white sticky top-0 z-20">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center gap-3">
        <span class="text-3xl">🤝</span>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">Helping Hand</h1>
          <p class="text-xs sm:text-sm text-gray-500 font-medium">Campaign Scripting Tool</p>
        </div>
      </div>
    </header>
    <main class="flex-1 max-w-5xl mx-auto w-full px-4 sm:px-6 py-6 sm:py-8">
      <p class="text-sm text-gray-500 mb-6">Select a campaign script to begin navigating the call flow.</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
        ${scripts.map(s => this.renderHomeCard(s)).join('')}
      </div>
    </main>`;
  },

  renderHomeCard(s) {
    const themeColors = {
      emerald: { card: 'hover:border-emerald-300', iconBg: 'bg-emerald-100', title: 'text-emerald-800' },
      amber:   { card: 'hover:border-amber-300', iconBg: 'bg-amber-100', title: 'text-amber-800' },
      rose:    { card: 'hover:border-rose-300', iconBg: 'bg-rose-100', title: 'text-rose-800' },
      purple:  { card: 'hover:border-purple-300', iconBg: 'bg-purple-100', title: 'text-purple-800' },
    };
    const tc = themeColors[s.colorTheme] || themeColors.emerald;
    return `
    <button data-action="selectScript" data-id="${s.id}" class="group text-left rounded-xl border border-gray-200 ${tc.card} p-5 sm:p-6 transition-all duration-200 hover:shadow-lg hover:shadow-gray-200/50 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-300">
      <div class="flex items-start gap-4">
        <div class="${tc.iconBg} w-12 h-12 rounded-lg flex items-center justify-center text-xl shrink-0">${s.icon}</div>
        <div class="min-w-0 flex-1">
          <h2 class="font-bold ${tc.title} text-base sm:text-lg leading-tight">${s.title}</h2>
          <p class="text-xs text-gray-500 font-medium mt-0.5">${s.subtitle}</p>
          <p class="text-sm text-gray-600 mt-2 line-clamp-2">${s.description}</p>
          <div class="flex items-center gap-3 mt-3">
            <span class="inline-flex items-center gap-1 text-xs font-medium text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              ${s.qualifications.length} quals
            </span>
            <span class="inline-flex items-center gap-1 text-xs font-medium text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
              ${s.steps.length} steps
            </span>
          </div>
        </div>
      </div>
    </button>`;
  },

  // =========== SCRIPT VIEWER ===========
  renderScriptViewer() {
    const c = this.getColorClasses();
    const s = this.currentScript;
    if (!s) return '';
    const st = this.currentStep;
    if (!st) return '';
    const isBookmarked = this.isBookmarked(st.id);

    return `
    <!-- Top Bar -->
    <header class="border-b border-gray-100 bg-white sticky top-0 z-20">
      <div class="flex items-center gap-2 sm:gap-3 px-3 sm:px-4 py-3">
        <button data-action="goHome" class="flex items-center gap-1.5 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"></path></svg>
          <span class="hidden sm:inline">Home</span>
        </button>
        <button data-action="goBack" class="flex items-center gap-1 text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors shrink-0" ${this.state.navHistory.length === 0 ? 'opacity-30 pointer-events-none' : ''} title="Go back to previous step">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          <span class="hidden sm:inline">Back</span>
        </button>
        <div class="h-5 w-px bg-gray-200 hidden sm:block"></div>
        <div class="flex items-center gap-2 min-w-0 flex-1">
          <span class="text-lg">${s.icon}</span>
          <h1 class="font-semibold text-sm sm:text-base text-gray-900 truncate">${s.title}</h1>
        </div>
        <button data-action="toggleBookmark" data-step="${st.id}" class="shrink-0 p-1.5 rounded-lg hover:bg-gray-100 transition-colors" title="Bookmark this step">
          <svg class="w-5 h-5 ${isBookmarked ? 'text-amber-500 fill-amber-500' : 'text-gray-400'}" fill="${isBookmarked ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
        </button>
        <!-- Mobile: hamburger for sidebar, FAB for right panel -->
        <button data-action="toggleSidebar" class="md:hidden shrink-0 p-1.5 rounded-lg hover:bg-gray-100 transition-colors" title="Steps">
          <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <button data-action="toggleRightPanel" class="md:hidden shrink-0 p-1.5 rounded-lg hover:bg-gray-100 transition-colors" title="Quick Refs & Notes">
          <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </button>
      </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar-enter fixed md:relative z-40 md:z-auto top-0 md:top-auto left-0 h-full md:h-auto w-72 md:w-64 lg:w-72 bg-white border-r border-gray-200 flex flex-col shrink-0 transition-transform duration-300 ease-out ${this.state.sidebarOpen ? 'sidebar-active' : ''} md:translate-x-0">
        <div class="p-3 border-b border-gray-100">
          <div class="relative">
            <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input id="search-input" type="text" placeholder="Search steps..." value="${this.state.searchQuery}" class="w-full pl-9 pr-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-300 bg-gray-50 focus:bg-white transition-colors">
          </div>
        </div>
        <!-- Progress -->
        <div class="px-3 pt-3 pb-1">
          <div class="flex items-center justify-between text-xs text-gray-500 mb-1.5">
            <span>Progress</span>
            <span class="font-medium">${this.currentStepIndex + 1} / ${s.steps.length}</span>
          </div>
          <div class="w-full ${c.progressBg} rounded-full h-1.5">
            <div class="${c.progressFill} h-1.5 rounded-full transition-all duration-300" style="width: ${this.progress}%"></div>
          </div>
        </div>
        <!-- Step list -->
        <div id="step-list" class="flex-1 overflow-y-auto scrollbar-thin py-2">
          ${this.renderSidebarSteps()}
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 overflow-y-auto scrollbar-thin">
        <div class="max-w-3xl mx-auto p-4 sm:p-6 lg:p-8">
          ${this.renderStepCard(st)}
        </div>
      </main>

      <!-- Right Panel (desktop) -->
      <aside id="right-panel" class="hidden md:flex w-72 lg:w-80 border-l border-gray-200 bg-white flex-col shrink-0">
        ${this.renderRightPanelContent()}
      </aside>
    </div>

    <!-- Mobile Right Panel (hidden by default) -->
    <div id="mobile-right-panel" class="fixed inset-0 z-40 md:hidden ${this.state.rightPanelOpen ? '' : 'hidden'}">
      <div class="absolute inset-0 bg-black/30" data-action="closeMobileRight"></div>
      <div class="absolute right-0 top-0 bottom-0 w-80 max-w-full bg-white shadow-xl flex flex-col">
        <div class="flex items-center justify-between p-3 border-b border-gray-100">
          <div class="flex gap-1">
            <button data-action="switchRightTab" data-tab="quickref" class="px-3 py-1.5 text-sm font-medium rounded-lg transition-colors ${this.state.activeRightTab === 'quickref' ? 'bg-gray-900 text-white' : 'text-gray-600 hover:bg-gray-100'}">Quick Refs</button>
            <button data-action="switchRightTab" data-tab="notes" class="px-3 py-1.5 text-sm font-medium rounded-lg transition-colors ${this.state.activeRightTab === 'notes' ? 'bg-gray-900 text-white' : 'text-gray-600 hover:bg-gray-100'}">Notes</button>
          </div>
          <button data-action="toggleRightPanel" class="p-1.5 rounded-lg hover:bg-gray-100">
            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="flex-1 overflow-y-auto scrollbar-thin">
          ${this.renderRightPanelContent()}
        </div>
      </div>
    </div>`;
  },

  renderSidebarSteps() {
    const steps = this.getFilteredSteps();
    const c = this.getColorClasses();
    return steps.map(st => {
      const ts = this.getStepTypeStyle(st.type);
      const isCurrent = st.id === this.state.currentStepId;
      const isVisited = this.state.visitedSteps.has(st.id);
      const isBm = this.isBookmarked(st.id);
      const isDq = st.type === 'dq';
      return `
      <button data-action="goToStep" data-step="${st.id}" class="step-sidebar-item w-full text-left px-3 py-2 mx-1.5 rounded-lg flex items-center gap-2.5 group ${isCurrent ? 'bg-gray-900 text-white shadow-md' : isDq ? 'hover:bg-red-50' : 'hover:bg-gray-50'} transition-colors">
        <span class="text-sm shrink-0">${ts.icon}</span>
        <span class="text-sm truncate flex-1 ${isCurrent ? 'font-semibold' : isVisited && !isCurrent ? 'text-gray-600' : 'text-gray-500'}">${st.title || st.type}</span>
        ${isBm ? '<svg class="w-3.5 h-3.5 text-amber-500 shrink-0 fill-amber-500" viewBox="0 0 24 24"><path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>' : ''}
      </button>`;
    }).join('');
  },

  renderStepCard(st) {
    const ts = this.getStepTypeStyle(st.type);
    const c = this.getColorClasses();
    const isBookmarked = this.isBookmarked(st.id);
    const speakerLabel = { agent: 'Agent', member: 'Member', system: 'System' }[st.speaker] || st.speaker;
    const speakerIcon = { agent: '🎯', member: '🗣️', system: '⚙️' }[st.speaker] || '📝';

    const fieldNote = st.field && st.field.note ? st.field.note : null;

    const scriptHtml = st.text.replace(/\n/g, '<br>');

    let branchesHtml = '';
    if (st.branches && st.branches.length > 0) {
      branchesHtml = `
      <div class="mt-6 space-y-2">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Branch Options</p>
        <div class="space-y-2">
          ${st.branches.map(b => {
            const isDefault = b.isDefault;
            const isDqBranch = b.targetStepId.includes('dq') || b.targetStepId.includes('soft-exit');
            let btnClass = 'border border-gray-200 hover:border-gray-400 hover:bg-gray-50 text-gray-700';
            if (isDefault) btnClass = `border ${c.border} hover:shadow-md ${c.bg} ${c.text} font-semibold`;
            if (isDqBranch && !isDefault) btnClass = 'border border-red-200 hover:bg-red-50 text-red-700';
            return `
            <button data-action="goToStep" data-step="${b.targetStepId}" class="branch-btn w-full flex items-center justify-between px-4 py-3 rounded-lg ${btnClass} text-left transition-all focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-gray-300">
              <span class="text-sm pr-2">${b.label}</span>
              <svg class="w-4 h-4 shrink-0 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    return `
    <div class="fade-in">
      <!-- Type Badge & Speaker -->
      <div class="flex items-center gap-2 mb-3 flex-wrap">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${ts.badgeBg}">
          <span>${ts.icon}</span> ${ts.label}
        </span>
        <span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-600">
          ${speakerIcon} ${speakerLabel}
        </span>
        ${(st.highlight ? '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium bg-amber-100 text-amber-700">⭐ Key Step</span>' : '')}
      </div>

      <!-- Card -->
      <div class="rounded-xl border-l-4 ${ts.border} ${st.type === 'dq' ? 'border border-red-200 bg-red-50/50' : 'border border-gray-200 bg-white'} ${ts.bg} shadow-sm overflow-hidden">
        <div class="p-5 sm:p-6">
          <h2 class="text-lg sm:text-xl font-bold text-gray-900 mb-3">${st.title || ''}</h2>
          <div class="text-base sm:text-lg leading-relaxed text-gray-800 whitespace-pre-line" id="step-text">${scriptHtml}</div>
          ${fieldNote ? `<p class="mt-3 text-sm italic text-gray-400 border-l-2 border-gray-200 pl-3">${fieldNote}</p>` : ''}
          ${st.notes ? `<div class="mt-4 p-3 bg-white/80 rounded-lg border border-gray-200"><p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Agent Note</p><p class="text-sm text-gray-600">${st.notes}</p></div>` : ''}
          ${(st.badges && st.badges.length > 0) ? `<div class="mt-4 flex flex-wrap gap-1.5">${st.badges.map(b => `<span class="inline-flex px-2 py-0.5 rounded text-xs font-semibold ${this.getBadgeStyle(b)}">${b}</span>`).join('')}</div>` : ''}
        </div>
      </div>

      ${branchesHtml}

      <!-- Navigation hint -->
      ${st.branches && st.branches.length === 0 && st.type === 'note' ? `
      <div class="mt-4 text-center">
        <p class="text-sm text-gray-400">End of script flow. Go back or return home.</p>
      </div>` : ''}
    </div>`;
  },

  renderRightPanelContent() {
    const s = this.currentScript;
    if (!s) return '';
    const showQr = this.state.activeRightTab === 'quickref';
    const showNotes = this.state.activeRightTab === 'notes';
    return `
    <!-- Tabs (desktop) -->
    <div class="hidden md:flex gap-1 p-3 border-b border-gray-100">
      <button data-action="switchRightTab" data-tab="quickref" class="px-3 py-1.5 text-sm font-medium rounded-lg transition-colors ${showQr ? 'bg-gray-900 text-white' : 'text-gray-600 hover:bg-gray-100'}">Quick Refs</button>
      <button data-action="switchRightTab" data-tab="notes" class="px-3 py-1.5 text-sm font-medium rounded-lg transition-colors ${showNotes ? 'bg-gray-900 text-white' : 'text-gray-600 hover:bg-gray-100'}">Notes</button>
    </div>
    <div class="overflow-y-auto scrollbar-thin p-3 space-y-3">
      ${showQr ? this.renderQuickRefs(s) : ''}
      ${showNotes ? this.renderNotesPanel() : ''}
    </div>`;
  },

  renderQuickRefs(s) {
    if (!s.quickRefs || s.quickRefs.length === 0) return '<p class="text-sm text-gray-400">No quick references.</p>';
    return s.quickRefs.map(qr => {
      const style = this.getQuickRefStyle(qr.type);
      return `
      <div class="border-l-4 ${style} rounded-lg p-3">
        <div class="flex items-center justify-between mb-1.5">
          <h4 class="text-sm font-semibold text-gray-800">${qr.label}</h4>
          <button data-action="copyQuickRef" data-qr-id="${qr.id}" class="p-1 rounded hover:bg-white/80 transition-colors" title="Copy">
            <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          </button>
        </div>
        <p class="text-sm text-gray-600 leading-relaxed">${qr.text.replace(/\n/g, '<br>')}</p>
      </div>`;
    }).join('');
  },

  renderNotesPanel() {
    const note = this.getNote();
    return `
    <div>
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Call Notes</p>
      <p class="text-xs text-gray-400 mb-3">Personal notes for this script. Saved automatically to your browser.</p>
      <textarea id="notes-textarea" class="w-full h-64 text-sm border border-gray-200 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-gray-300 resize-y bg-gray-50 focus:bg-white transition-colors" placeholder="Write your notes here...">${note.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea>
    </div>`;
  },

  // =========== EVENT HANDLING ===========
  attachEvents() {
    document.querySelectorAll('[data-action]').forEach(el => {
      const action = el.getAttribute('data-action');
      // Remove old listeners by cloning
      const newEl = el.cloneNode(true);
      el.parentNode.replaceChild(newEl, el);

      newEl.addEventListener('click', (e) => {
        switch(action) {
          case 'selectScript':
            this.selectScript(newEl.getAttribute('data-id'));
            break;
          case 'goHome':
            this.goHome();
            break;
          case 'goBack':
            this.goBack();
            break;
          case 'goToStep':
            this.goToStep(newEl.getAttribute('data-step'));
            break;
          case 'toggleSidebar':
            this.toggleSidebar();
            break;
          case 'toggleRightPanel':
            this.toggleRightPanel();
            break;
          case 'switchRightTab':
            const tab = newEl.getAttribute('data-tab');
            this.state.activeRightTab = tab;
            this.render();
            break;
          case 'toggleBookmark':
            this.toggleBookmark(newEl.getAttribute('data-step'));
            break;
          case 'copyText': {
            const st = this.currentStep;
            if (st) this.copyText(st.text);
            break;
          }
          case 'copyQuickRef': {
            const s = this.currentScript;
            const qrId = newEl.getAttribute('data-qr-id');
            const qr = s?.quickRefs.find(q => q.id === qrId);
            if (qr) this.copyText(qr.text);
            break;
          }
          case 'closeMobileRight':
            this.state.rightPanelOpen = false;
            this.render();
            break;
        }
      });
    });

    // Search input
    const searchInput = document.getElementById('search-input');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        this.handleSearch(e.target.value);
      });
      // Restore focus & cursor
      if (this.state.searchOpen) {
        searchInput.focus();
        searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
      }
    }

    // Notes textarea
    const notesArea = document.getElementById('notes-textarea');
    if (notesArea) {
      notesArea.addEventListener('input', (e) => {
        this.saveNote(e.target.value);
      });
    }

    // Handle overlay cleanup
    this.renderOverlay();
  },

  renderSidebar() {
    const sb = document.getElementById('sidebar');
    if (!sb) return;
    if (this.state.sidebarOpen) {
      sb.classList.add('sidebar-active');
      sb.classList.remove('sidebar-enter');
    } else {
      sb.classList.remove('sidebar-active');
      sb.classList.add('sidebar-enter');
    }
    this.renderOverlay();
  },

  renderRightPanel() {
    const mrp = document.getElementById('mobile-right-panel');
    if (!mrp) return;
    if (this.state.rightPanelOpen) {
      mrp.classList.remove('hidden');
    } else {
      mrp.classList.add('hidden');
    }
    this.renderOverlay();
  },
};

// Initialize
App.init();
</script>
</body>
</html>
